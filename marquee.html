<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <marquee direction="right">
            <h1>Hello! My name is Sancheet</h1>
        </marquee>

        <marquee direction="left">
            <h1>Hello! My name is Sancheet</h1>
        </marquee>

        <marquee bgcolor="red">
            <h1>Hello! My name is Sancheet</h1>
        </marquee>

        <marquee behavior="alternate">
            <h1>Hello! My name is Sancheet</h1>
        </marquee>

        <marquee scrolldelay="2">
            <h1>Hello! My name is Sancheet</h1>
        </marquee>

        <marquee scrollamount="50">
            <h1>Hello! My name is Sancheet</h1>
        </marquee>

        <marquee direction="up" height="300px">
            <h1>Hello! My name is Sancheet</h1>
        </marquee>

        <marquee direction="down" height="300px">
            <h1>Hello! My name is Sancheet</h1>
        </marquee>
    </body>
</html>
