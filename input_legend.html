<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information</title>
</head>
<body>
    <fieldset>
        <legend><h2>Contact Form</h2></legend>
        <form>
            <label>Enter Name: </label>
            <input type="text" placeholder="Raj"><br><br>

            <label>Enter Email: </label>
            <input type="email" placeholder="abc@email.com"><br><br>

            <label>Aadhar no.: </label>
            <input type="number" placeholder="123456789077"><br><br>

            <label>Password: </label>
            <input type="password" placeholder="Enter Password"><br><br>

            <label>Choose Gender: </label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <input type="radio" name="gender">Others<br><br>

            <input type="submit" value="Submit Form">
        </form>
    </fieldset>
</body>
</html>
