<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eamples of table</title>
</head>
<body>

    <!-- Table using Rowspan -->
    <table border="2">
        <thead>
            <th>Car Type</th>
            <th>Car Name</th>
        </thead>

        <tbody>
            <tr>
                <td rowspan="5"> SUV</td>
                <td>Creta</td>
            </tr>

            <tr>
                <td>BMW X7</td>
            </tr>

            <tr>
                <td>XUV700</td>
            </tr>

            <tr>
                <td>Sieera</td>
            </tr>

            <tr>
                <td>Safari</td>
            </tr>

            <tr>
                <td rowspan="4">Sedan</td>
                <td>Verna</td>
            </tr>

            <tr>
                <td>City</td>
            </tr>

            <tr>
                <td>Virtus</td>
            </tr>

            <tr>
                <td>camry</td>
            </tr>
        </tbody>

        <br>
        <hr>
        <hr>

        <!-- Table using colspan -->
        <table border="2">
            <thead>
                <tr>
                    <th colspan="9">Car</th>
                </tr>
            </thead>

            <tbody>
                
                <tr>
                    <th colspan="5">Suv</th>
                    <th colspan="4">Sedan</th>
                </tr>
                <tr>
                    <td>BMW X7</td>
                    <td>XUV700</td>
                    <td>Creta</td>
                    <td>Siera</td>
                    <td>Safari</td>
                    
                    <td>Camry</td>
                    <td>City</td>
                    <td>Verna</td>
                    <td>Glaze</td>
                </tr>
            </tbody>

            Used footer
            <tfoot>
                <tr>
                    <th colspan="5">Suv</th>
                    <th colspan="4">Sedan</th>
                </tr>
            </tfoot>
        </table>
    </table>
</body>
</html>
